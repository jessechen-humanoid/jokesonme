name = "jokesonme"
main = "worker.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# account_id 不寫死，由環境變數 CLOUDFLARE_ACCOUNT_ID 提供。
# 金鑰（SUPABASE_*、LINE_*、AUTH_SECRET、CRON_SECRET）一律 `wrangler secret put`，永遠不進這個檔。

# 指定在東京執行（speed-and-note-alias）：免費方案台灣請求會進美國機房，資料庫在東京。
# smart 模式實測反而放到西雅圖（cf-placement: remote-SEA，因 supabase.co 也走 Cloudflare，判斷不出遠近）；
# hostname 模式同理無效。改指定 AWS 東京後為 remote-NRT，2026-10-09 實測各頁中位數 0.52–0.68s → 0.31–0.37s。
[placement]
mode = "targeted"
region = "aws:ap-northeast-1"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
APP_URL = "https://jokesonme.jesse-chen.workers.dev"
AUTH_URL = "https://jokesonme.jesse-chen.workers.dev"
AUTH_TRUST_HOST = "true"
# 演出公開日曆（觀眾訂閱用的公開網址，不是機密；平台只讀）
SHOW_CALENDAR_ICS_URL = "https://calendar.google.com/calendar/ical/b74923a589b7be6546e3dc7be18121230e2f5cf67cd76d88482ca535dbd3dd9d%40group.calendar.google.com/public/basic.ics"

# 平台不發推播（2026-10-03 取消演出前推播，改 tag 傑瓜詢問）。
# 一般聊天清理：UTC 19:30 = 台北 03:30（design.md「一般聊天只保留 14 天」）
# 必須跟 worker.ts 的 CRON_ROUTES 一致。
[triggers]
crons = ["30 19 * * *"]
