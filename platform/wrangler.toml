name = "jokesonme"
main = "worker.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# account_id 不寫死，由環境變數 CLOUDFLARE_ACCOUNT_ID 提供。
# 金鑰（SUPABASE_*、LINE_*、AUTH_SECRET、CRON_SECRET）一律 `wrangler secret put`，永遠不進這個檔。

# 智慧放置：免費方案在台灣的請求常被送到美國機房，而資料庫在東京。
# 讓 Worker 在靠近 Supabase 的地方執行，一頁多次查詢就不用每次跨洋（2026-10-03 實測 cf-ray 為 SJC）。
[placement]
mode = "smart"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
APP_URL = "https://jokesonme.jesse-chen.workers.dev"
AUTH_URL = "https://jokesonme.jesse-chen.workers.dev"
AUTH_TRUST_HOST = "true"

# 演出前推播：UTC 02:00 = 台北 10:00（design.md「LINE webhook 與推播額度策略」）
# 一般聊天清理：UTC 19:30 = 台北 03:30（design.md「一般聊天只保留 14 天」）
# 必須跟 worker.ts 的 CRON_ROUTES 一致。
[triggers]
crons = ["0 2 * * *", "30 19 * * *"]
